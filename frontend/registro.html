<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro | HSBarber</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body data-page="registro">
  <nav class="nav">
    <a class="logo" href="index.html">HSBarber</a>
    <div class="nav-links" id="nav-links"></div>
  </nav>
  <section class="wrap">
    <h2>Crear cuenta de cliente</h2>
    <p class="muted">Con tu cuenta puedes ver y cancelar tus reservas.</p>
    <div id="aviso"></div>
    <form id="f">
      <label>Nombre</label>
      <input name="nombre" required />
      <label>Teléfono</label>
      <input name="telefono" required />
      <label>Email</label>
      <input name="email" type="email" required />
      <label>Contraseña</label>
      <input name="password" type="password" required minlength="8" />
      <button>Registrarme</button>
    </form>
    <p>¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
  </section>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/chatbot.js"></script>
</body>
</html>
