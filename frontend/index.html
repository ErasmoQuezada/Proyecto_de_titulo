<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HSBarber</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body data-page="home">
  <nav class="nav">
    <a class="logo" href="index.html">HSBarber</a>
    <div class="nav-links" id="nav-links"></div>
  </nav>

  <section class="hero">
    <h1>Reserva tu corte</h1>
    <p class="muted">Puedes reservar sin registrarte. Si tienes cuenta, inicia sesión para ver y cancelar tus reservas.</p>
  </section>

  <section class="card">
    <h2>Nueva reserva</h2>
    <div id="aviso"></div>
    <form id="form-reserva">
      <div class="grid">
        <div>
          <label>Nombre</label>
          <input name="nombre" required />
        </div>
        <div>
          <label>Teléfono</label>
          <input name="telefono" required />
        </div>
        <div>
          <label>Email (opcional)</label>
          <input name="email" type="email" />
        </div>
        <div>
          <label>Servicio</label>
          <select name="servicio" id="sel-servicio" required></select>
        </div>
        <div>
          <label>Barbero</label>
          <select name="barberoId" id="sel-barbero" required></select>
        </div>
        <div>
          <label>Fecha</label>
          <input name="fecha" type="date" required />
        </div>
        <div>
          <label>Hora</label>
          <select name="hora" id="sel-hora" required></select>
        </div>
      </div>
      <button type="submit">Reservar</button>
    </form>
  </section>

  <p class="footer">HSBarber · Corte, barba y estilo</p>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/chatbot.js"></script>
</body>
</html>
